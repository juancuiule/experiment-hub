# Single public origin, split by path: / -> frontend, /api/* -> backend.
# Only reachable from the cloudflared container over the compose network,
# not published to the host — Cloudflare Tunnel is the only public entry
# point.
log_format hub '$remote_addr $host $request_method $request_uri '
              '$status $request_time';

geo $realip_remote_addr $trusted_ingress {
    default 0;
    172.30.70.10 1;
    127.0.0.1 1;
    ::1 1;
}

# Participant writes (run registration + checkpoints) are anonymous, so the
# edge carries the anti-abuse fence: a per-client-IP request rate and a hard
# body-size cap. $binary_remote_addr resolves through CF-Connecting-IP via
# set_real_ip_from above. Bursts queue rather than 429 so participants behind
# a shared NAT wait instead of failing.
#
# Researcher traffic (exports) gets its own bucket, so a researcher pulling
# data — or someone brute-forcing the export token — can never drain the
# participants' quota, and vice versa. Health checks are not limited at all.
limit_req_zone $binary_remote_addr zone=participant:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=researcher:10m rate=1r/s;

# Anything addressed to another hostname is dropped — only the tunnel's
# apex is served.
server {
    listen 80 default_server;
    return 444;
}

server {
    listen 80;
    server_name experiment-hub.com;
    access_log /dev/stdout hub;
    error_log /dev/stderr warn;
    set_real_ip_from 172.30.70.10;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    if ($trusted_ingress = 0) { return 403; }

    # No trailing slash on proxy_pass: the backend's own routes carry the
    # /api prefix, so the original path is forwarded intact.

    # Liveness probes must never compete with participant traffic for the
    # rate-limit bucket.
    location = /api/health {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP "";
        # The edge is always TLS — report the client-facing scheme, not the
        # hop to us.
        proxy_set_header X-Forwarded-Proto https;
    }

    # Participant writes: POST /api/runs and /api/runs/:id/checkpoints. The
    # 1m body cap sits above the app's 1,000,000-byte context cap plus
    # bounded metadata, so every context the app accepts fits through here.
    location ~ ^/api/runs(/|$) {
        client_max_body_size 1m;
        limit_req zone=participant burst=20;
        limit_req_status 429;
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        # The edge is always TLS — report the client-facing scheme, not the
        # hop to us.
        proxy_set_header X-Forwarded-Proto https;
    }

    # Everything else under /api is researcher-facing (bearer-gated export,
    # experiment publish, openapi) — separate bucket, still limited to blunt
    # token brute-forcing. PUTs carry full experiment configs, so the body
    # cap is higher than the participant bucket's: 5m exceeds the app's own
    # 4.5 MB config ceiling with framing headroom.
    location /api/ {
        client_max_body_size 5m;
        limit_req zone=researcher burst=10;
        limit_req_status 429;
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        # The edge is always TLS — report the client-facing scheme, not the
        # hop to us.
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        # The edge is always TLS — report the client-facing scheme, not the
        # hop to us.
        proxy_set_header X-Forwarded-Proto https;
    }
}
